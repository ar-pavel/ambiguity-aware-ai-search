<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask, Show, or Just Do It?</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Candidate search</h1>
    <p class="hint">Describe who you are looking for, for example <em>senior Java developers in London</em>.</p>

    <form id="ask-form">
      <label for="request" class="sr-only">Search request</label>
      <input id="request" name="request" autocomplete="off" placeholder="e.g. Java with Python in London">
      <button type="submit">Search</button>
    </form>

    <!-- Settings for comparing the strategies (and for evaluation): the rule's choice can be overridden. -->
    <div class="controls">
      <label>Strategy
        <select id="mode">
          <option value="auto">Auto: the rule decides</option>
          <option value="act">Always act</option>
          <option value="show">Always show</option>
          <option value="ask">Always ask</option>
        </select>
      </label>
      <label>Ask when the lists share less than
        <input id="theta" type="range" min="0" max="1" step="0.05" value="0.5" aria-describedby="theta-value">
        <output id="theta-value" for="theta">50%</output>
      </label>
    </div>

    <!-- One fixed layout for every mode; only the contents of each slot change. -->
    <section id="mode-line" aria-live="polite" hidden></section>
    <section id="interpretation" hidden></section>
    <p id="count" hidden></p>
    <table id="results" hidden>
      <thead><tr><th>Name</th><th>Title</th><th>Skills</th><th>Years</th><th>City</th><th>Work mode</th><th>Notice</th></tr></thead>
      <tbody></tbody>
    </table>
    <p id="scope" class="scope" hidden></p>
    <p id="error" role="alert" hidden></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
