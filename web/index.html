<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask, Show, or Just Do It?</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Recruitment search</h1>
    <p class="hint">Describe the people or jobs you are looking for, for example <em>senior Java developers in London</em>
      or <em>open Python roles</em>.</p>

    <form id="ask-form">
      <label for="request" class="sr-only">Search request</label>
      <input id="request" name="request" autocomplete="off" placeholder="e.g. Java with Python in London">
      <button type="submit">Search</button>
    </form>

    <!-- Settings for comparing the strategies (and for evaluation): the rule's choice can be overridden. -->
    <div class="controls">
      <label>Strategy
        <select id="mode">
          <option value="auto">Auto: the rule decides</option>
          <option value="act">Always act</option>
          <option value="show">Always show</option>
          <option value="ask">Always ask</option>
        </select>
      </label>
      <label>Ask when the lists share less than
        <input id="theta" type="range" min="0" max="1" step="0.05" value="0.5" aria-describedby="theta-value">
        <output id="theta-value" for="theta">50%</output>
      </label>
    </div>

    <!-- One fixed layout for every mode; only the contents of each slot change. -->
    <section id="mode-line" aria-live="polite" hidden></section>
    <!-- Why this mode: the rule's own numbers, collapsed by default (Amershi G11). -->
    <details id="why" hidden><summary>Why?</summary><div class="why-body"></div></details>
    <p id="notice" role="status" hidden></p>
    <section id="interpretation" hidden></section>
    <div class="count-row">
      <p id="count" hidden></p>
      <!-- Write actions: shown only with results, never while a question is open. Always confirmed. -->
      <div id="actions" hidden></div>
    </div>
    <table id="results" hidden>
      <thead></thead>
      <tbody></tbody>
    </table>
    <p id="scope" class="scope" hidden></p>
    <p id="error" role="alert" hidden></p>

    <!-- The confirmation for every write: what was searched, exactly what will change, and what will not. -->
    <dialog id="confirm" aria-labelledby="confirm-title">
      <form method="dialog">
        <h2 id="confirm-title">Check before changing anything</h2>
        <p class="confirm-read-as"></p>
        <label id="job-pick" hidden>Shortlist for
          <select id="job"><option value="">Choose a job…</option></select>
        </label>
        <p class="confirm-summary"></p>
        <ul class="confirm-changes"></ul>
        <details class="confirm-skipped" hidden><summary></summary><ul></ul></details>
        <p class="confirm-error" role="alert"></p>
        <div class="confirm-buttons">
          <button value="cancel" class="secondary" id="confirm-cancel">Cancel</button>
          <button value="apply" id="confirm-apply" type="button">Confirm</button>
        </div>
        <p class="confirm-undo">You can undo this afterwards.</p>
      </form>
    </dialog>
  </main>
  <script src="app.js"></script>
</body>
</html>
