<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask, Show, or Just Do It?</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
  <header class="top">
    <h1><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Ask, Show, or Just Do It?</h1>
    <button type="button" class="link" id="new-chat">New conversation</button>
  </header>

  <!-- The conversation. Each request or action is a turn. Only the latest assistant turn is live:
       its chips, question and buttons work; earlier turns are frozen, so a click never applies to an
       old request. The reading stays visible and directly editable (W3 L07 hybrid). -->
  <p id="status" class="sr-only" role="status"></p>
  <main id="chat" aria-label="Conversation">
    <section class="turn welcome">
      <h2 class="welcome-title">Who are you looking for?</h2>
      <p>Describe the people or jobs you need. If something is unclear, I'll show how I read it,
        or ask you one question first.</p>
      <div class="suggestions" role="group" aria-labelledby="try">
        <span id="try" class="muted">Try:</span>
        <button type="button" class="suggestion">senior Java developers</button>
        <button type="button" class="suggestion">Java with Python in London</button>
        <button type="button" class="suggestion">Java developers at Bluefin</button>
        <button type="button" class="suggestion">open jobs in London</button>
      </div>
    </section>
  </main>

  <form id="ask-form" class="composer">
    <label for="request" class="sr-only">Your request</label>
    <input id="request" name="request" autocomplete="off" placeholder="e.g. Python and AWS people in London">
    <button type="submit" aria-keyshortcuts="Enter">Send <kbd class="key" aria-hidden="true">↵</kbd></button>
  </form>

  <footer class="study-footer">
    <!-- Study settings: for comparing the strategies, kept out of the task path (UX review fix 6). -->
    <details class="study">
      <summary>Study settings</summary>
      <div class="controls">
        <label>Strategy
          <select id="mode">
            <option value="auto">Auto: the rule decides</option>
            <option value="act">Always act</option>
            <option value="show">Always show</option>
            <option value="ask">Always ask</option>
          </select>
        </label>
        <label>Ask when the lists share less than
          <input id="theta" type="range" min="0" max="1" step="0.05" value="0.5" aria-describedby="theta-value">
          <output id="theta-value" for="theta">50%</output>
        </label>
      </div>
    </details>
  </footer>
  </div>

  <!-- The confirmation for every write: what was searched, exactly what will change, and what will not. -->
  <dialog id="confirm" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">Check before changing anything</h2>
      <p class="confirm-read-as"></p>
      <label id="job-pick" hidden>Shortlist for
        <select id="job"><option value="">Choose a job…</option></select>
      </label>
      <p class="confirm-summary"></p>
      <p class="confirm-warning" hidden></p>
      <ul class="confirm-changes"></ul>
      <details class="confirm-skipped" hidden><summary></summary><ul></ul></details>
      <p class="confirm-error" role="alert"></p>
      <div class="confirm-buttons">
        <button value="cancel" class="secondary" id="confirm-cancel">Cancel</button>
        <button value="apply" id="confirm-apply" type="button">Confirm</button>
      </div>
      <p class="confirm-undo">You can undo this afterwards.</p>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
