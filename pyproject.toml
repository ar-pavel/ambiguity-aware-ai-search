# Settings for the linter that CI runs (ruff). The app itself needs nothing installed:
# it is standard-library Python 3.8+, so there are no dependencies listed here.
[tool.ruff]
line-length = 120
target-version = "py38"
extend-exclude = [".claude"]

[tool.ruff.lint]
# pycodestyle errors and warnings, pyflakes, import order, likely bugs
select = ["E", "W", "F", "I", "B"]
